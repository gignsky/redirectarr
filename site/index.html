<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>redirectarr — coming soon</title>
  <meta name="description" content="redirectarr is under construction. A friendlier home for domains still finding their footing." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦖</text></svg>" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --bg-glow: #161a24;
      --fg: #e9edf5;
      --muted: #8a92a6;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(circle at 20% 20%, var(--bg-glow), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(167, 139, 250, 0.12), transparent 40%),
        var(--bg);
      text-align: center;
    }
    main {
      max-width: 36rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }
    .badge .dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0.6rem var(--accent);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    h1 {
      font-size: clamp(2.25rem, 6vw, 3.5rem);
      margin: 0 0 0.75rem;
      background: linear-gradient(120deg, var(--fg), var(--accent) 60%, var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 auto 0.5rem;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      opacity: 0.7;
    }
    footer a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge"><span class="dot"></span>work in progress</div>
    <h1>redirectarr is warming up</h1>
    <p>This domain is reserved and under construction. Soon it'll be home to a proper waiting page — for now, thanks for stopping by.</p>
    <footer>&copy; 2026 redirectarr &middot; <a href="https://github.com/gignsky/redirectarr">source</a></footer>
  </main>
</body>
</html>
